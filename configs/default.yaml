sonic:
  dof: 29
  token_dim: 64
  token_groups: 2
  fsq_levels: 32
  future_frames: 10
  future_stride: 5
  prop_history: 10
  encoder_hidden: [256, 256, 128]
  controller_hidden: [384, 384, 256, 128]
  recon_hidden: [256, 256, 128]
  critic_hidden: [384, 256, 128]

ppo:
  num_envs: 256
  rollout_steps: 32
  ppo_epochs: 5
  minibatches: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  entropy_coef: 0.013
  actor_lr: 2.0e-5
  actor_lr_min: 1.0e-5
  actor_lr_max: 2.0e-4
  kl_adaptation_factor: 1.5
  critic_lr: 1.0e-3
  aux_recon_coef: 0.01
  target_kl: 0.01
  seed: 0
  checkpoint_interval: 100
  eval_interval: 100
  failure_sampling_alpha: 0.9
  failure_sampling_cap: 200.0
  adaptive_sampling_bin_frames: 50
  pre_failure_sample_window: 200
  freeze_frame_probability: 0.1

flow:
  action_dim: 64
  action_horizon: 40
  state_dim: 68
  goal_dim: 48
  model_dim: 192
  num_layers: 3
  num_heads: 6
  inference_steps: 4
  beta_alpha: 1.5
  beta_beta: 1.0
  noise_scale: 0.999
  state_dropout_prob: 0.2
  condition_dropout_prob: 0.1
  seed: 0

sim:
  physics_dt: 0.005
  decimation: 4
  device: cuda:0
  nconmax: 48
  njmax: 288
  action_scale: null
  sonic_g1_control: true
  actuator_mode: auto
  joint_stiffness: 80.0
  joint_damping: 2.0
  soft_joint_limit_factor: 0.9
  undesired_contact_penetration: 1.0e-4
  enable_randomization: false

replay:
  control_hz: 50
  camera_hz: 10
  save_rgb: false
