[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-groot-sonic"
version = "0.1.0"
description = "Compact GR00T+SONIC-inspired G1 research scaffold using PyTorch and MuJoCo Warp"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "torch>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
sim = [
  "mujoco>=3.3",
  "mujoco-warp>=3.9.0.1",
  "warp-lang>=1.8",
]
vlm = [
  "transformers>=4.49",
  "pillow>=10",
  "safetensors>=0.4",
]
video = ["imageio>=2.34", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.6"]
all = [
  "mujoco>=3.3",
  "mujoco-warp>=3.9.0.1",
  "warp-lang>=1.8",
  "transformers>=4.49",
  "pillow>=10",
  "safetensors>=0.4",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "pytest>=8.0",
]

[project.scripts]
mgsp-preprocess-bones = "mini_groot_sonic.tools.preprocess_bones:main"
mgsp-train-body = "mini_groot_sonic.tools.train_body:main"
mgsp-collect-replay = "mini_groot_sonic.tools.collect_replay:main"
mgsp-train-flow = "mini_groot_sonic.tools.train_flow:main"
mgsp-run-command = "mini_groot_sonic.tools.run_command:main"
mgsp-eval-body = "mini_groot_sonic.tools.eval_body:main"
mgsp-render-body = "mini_groot_sonic.tools.render_body:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
