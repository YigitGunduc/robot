[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sonic-groot-mjx-reference"
version = "0.1.0"
description = "MuJoCo-Warp/PyTorch reference implementation of SONIC-like G1 motion tracking and a compact GR00T-like action model."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.3",
  "pyyaml>=6.0",
  "pandas>=2.0",
  "scipy>=1.11",
  "joblib>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
sim = ["mujoco>=3.4", "mujoco-warp", "warp-lang>=1.9"]
hf = ["transformers>=4.57", "huggingface_hub>=0.30", "pillow>=10"]
quantizer = ["vector-quantize-pytorch>=1.24"]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gear_sonic_mjx*", "groot_lite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
