[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "g1-robot-stack"
version = "0.1.0"
description = "Replaceable simulation and controller scaffolding for a Unitree G1"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
sim = [
  "mujoco>=3.3,<4",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
g1-stack = "g1_stack.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/g1_stack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
