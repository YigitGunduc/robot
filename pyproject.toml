[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonic-lite-g1"
version = "0.1.0"
description = "Small SONIC-inspired tokenized motion imitation controller for Unitree G1 on mjlab/MuJoCo-Warp"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab>=1.5.3",
  "numpy>=1.26",
]

[project.entry-points."mjlab.tasks"]
sonic_lite_g1 = "sonic_lite_g1"

[project.scripts]
sonic-lite-select-bones = "sonic_lite_g1.data.select_bones:main"
sonic-lite-pack-motions = "sonic_lite_g1.data.pack_motions:main"
sonic-lite-bones-to-mjlab-csv = "sonic_lite_g1.data.bones_to_mjlab_csv:main"

[tool.hatch.build.targets.wheel]
packages = ["sonic_lite_g1"]

[tool.pytest.ini_options]
pythonpath = ["."]
